<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123D2A" />
    <title>LuxLawn Admin Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f4ea;
        color: #123d2a;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(520px, calc(100% - 32px));
        border-radius: 28px;
        background: white;
        padding: 32px;
        box-shadow: 0 24px 80px rgba(18, 61, 42, 0.16);
      }
      h1 {
        margin: 0;
        font-size: 32px;
      }
      p {
        color: #1f2933;
        line-height: 1.7;
      }
      a {
        color: #123d2a;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>LuxLawn Admin needs an internet connection for live bookings, customers, and Supabase data. Reconnect and refresh to continue managing the business.</p>
      <a href="/admin">Try again</a>
    </main>
  </body>
</html>
